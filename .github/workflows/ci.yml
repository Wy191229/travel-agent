name: Lightweight CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  code-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Compile check
        run: |
          python -m py_compile app.py
          python -m py_compile rag.py
          python -m py_compile memory.py
          python -m py_compile observability.py
          python -m py_compile eval/run_eval.py

      - name: Validate eval cases
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("eval/cases.jsonl")
          if not path.exists():
              raise SystemExit("eval/cases.jsonl is missing")

          count = 0
          with path.open("r", encoding="utf-8") as f:
              for line_no, line in enumerate(f, 1):
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      case = json.loads(line)
                  except json.JSONDecodeError as exc:
                      raise SystemExit(f"Invalid JSON at line {line_no}: {exc}") from exc

                  for field in ("id", "category", "message"):
                      if field not in case:
                          raise SystemExit(f"Missing field {field!r} at line {line_no}")
                  count += 1

          print(f"Validated {count} eval cases")
          PY

      - name: Repository hygiene check
        run: |
          test ! -f .env || (echo ".env must not be committed" && exit 1)

          db_files=$(find . -path ./.git -prune -o \( -name "*.db" -o -name "*.sqlite" -o -name "*.sqlite3" \) -print)
          if [ -n "$db_files" ]; then
            echo "Database files must not be committed:"
            echo "$db_files"
            exit 1
          fi

          if [ -d eval/reports ] && find eval/reports -type f | grep -q .; then
            echo "eval/reports generated files must not be committed"
            find eval/reports -type f
            exit 1
          fi

          echo "Repository hygiene check passed"
