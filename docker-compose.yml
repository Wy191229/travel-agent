services:
  travel-agent-docker:
    build: .
    container_name: travel-agent-docker
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./.env:/app/.env:ro
      - ./knowledge:/app/knowledge:ro
      - ./rag_data:/app/rag_data
      - ./docker_data/memory.db:/app/memory.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
